<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SUPER MAMA 25</title>
<meta name="description" content="お誕生日おめでとう">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="stage">
  <canvas id="game" width="240" height="320"></canvas>

  <div id="ui">
    <!-- タイトル -->
    <section class="screen" id="s-title">
      <div class="title-wrap">
        <div class="title-super">SUPER</div>
        <div class="title-main">MAMA</div>
        <div class="title-25">25</div>
      </div>
      <button class="nes-btn blink" id="btn-start">PRESS START</button>
      <p class="hint">画面をタップ</p>
    </section>

    <!-- 登場シーン中のセリフ -->
    <section class="screen hidden" id="s-intro">
      <div class="namebox" id="namebox"></div>
      <button class="nes-btn small ghost skip" id="btn-skip">SKIP ▶</button>
    </section>

    <!-- ろうそく -->
    <section class="screen hidden" id="s-candles">
      <div class="dialog top">
        <p>ろうそくを ぜんぶ けそう</p>
        <p class="sub">画面を <b>長押し</b> して 息をためて、はなす</p>
      </div>
      <div class="meter"><div class="meter-fill" id="breath"></div></div>
      <div class="counter" id="candle-left">のこり 25</div>
    </section>

    <!-- 年齢クイズ -->
    <section class="screen hidden" id="s-quiz">
      <div class="dialog center">
        <p class="q">きょうで なんさい?</p>
        <div class="choices" id="choices"></div>
        <p class="answer" id="quiz-answer"></p>
      </div>
    </section>

    <!-- メッセージ -->
    <section class="screen hidden" id="s-end">
      <div class="dialog bottom">
        <p class="hbd">HAPPY BIRTHDAY</p>
        <div id="message"></div>
        <p class="from" id="from"></p>
        <button class="nes-btn small" id="btn-again">もういちど</button>
      </div>
    </section>

    <button class="nes-btn tiny sound" id="btn-sound" aria-label="音">♪ ON</button>
  </div>
</div>
<script src="config.js?v=6"></script>
<script src="js/sprites.js?v=6"></script>
<script src="js/world.js?v=6"></script>
<script src="js/main.js?v=6"></script>
</body>
</html>
